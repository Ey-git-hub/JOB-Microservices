spring:
  application:
    name: companyms
  config:
    import: "optional:file:.env[.properties]"  # Tells Spring Boot to import the .env file from the root directory

  
  datasource:
    url: ${CMS_DATABASE_URL}
    username: ${CMS_DATABASE_USERNAME}
    password: ${CMS_DATABASE_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: update
    
    database-platform: org.hibernate.dialect.PostgreSQLDialect
 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080

